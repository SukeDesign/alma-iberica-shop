<main id="main">
  <div class="container pt-3 pb-5">
    <nav aria-label="Brotkrümelnavigation"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Start</a></li><li class="breadcrumb-item active" aria-current="page">Mein Konto</li></ol></nav>
    <h1 class="mb-4">Mein Konto</h1>
    <div class="row g-4">
      <div class="col-md-6"><section class="buy-box" aria-labelledby="login-title"><h2 class="h4" id="login-title">Anmelden</h2>
        <form novalidate><div class="mb-3"><label class="form-label" for="l-mail">E-Mail <span class="req" aria-hidden="true">*</span></label><input class="form-control" type="email" id="l-mail" autocomplete="username" required></div>
        <div class="mb-3"><label class="form-label" for="l-pw">Passwort <span class="req" aria-hidden="true">*</span></label><input class="form-control" type="password" id="l-pw" autocomplete="current-password" required></div>
        <button class="btn btn-primary" type="submit">Anmelden</button> <a class="ms-2" href="contact.html">Passwort vergessen?</a></form></section></div>
      <div class="col-md-6"><section class="buy-box" aria-labelledby="reg-title"><h2 class="h4" id="reg-title">Neu registrieren</h2>
        <form novalidate><div class="mb-3"><label class="form-label" for="r-name">Name <span class="req" aria-hidden="true">*</span></label><input class="form-control" id="r-name" autocomplete="name" required></div>
        <div class="mb-3"><label class="form-label" for="r-mail">E-Mail <span class="req" aria-hidden="true">*</span></label><input class="form-control" type="email" id="r-mail" autocomplete="email" required></div>
        <div class="mb-3"><label class="form-label" for="r-pw">Passwort (mind. 8 Zeichen) <span class="req" aria-hidden="true">*</span></label><input class="form-control" type="password" id="r-pw" autocomplete="new-password" minlength="8" required></div>
        <button class="btn btn-primary" type="submit">Konto erstellen</button></form></section></div>
    </div>
    <section class="mt-5" id="wunschliste" aria-labelledby="wl-title"><h2 id="wl-title" class="h3 mb-3">Wunschliste</h2>
      <div class="row row-cols-2 row-cols-md-4 g-3" data-wishlist><p class="col-12" data-wishlist-empty>Ihre Wunschliste ist leer. Klicken Sie bei einem Produkt auf das Herz.</p></div></section>
  </div>
  <template id="card-tpl">{{cards:all}}</template>
</main>
