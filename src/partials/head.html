<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{canonical}}">
  <link rel="alternate" hreflang="de-DE" href="{{canonical}}">
  <link rel="alternate" hreflang="x-default" href="{{canonical}}">
  <meta name="author" content="{{brand}}">
  <meta name="theme-color" content="#7F1D23">
  <!-- GEO / Local SEO: Standort Essen (Werte aus build.py → BRAND) -->
  <meta name="geo.region" content="{{region_code}}">
  <meta name="geo.placename" content="{{city}}">
  <meta name="geo.position" content="{{lat}};{{lon}}">
  <meta name="ICBM" content="{{lat}}, {{lon}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{brand}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{base_url}}/assets/img/hero.webp">
  <meta property="og:image:alt" content="Alma Ibérica – iberische Feinkost, Wein und Bacalhau aus Essen">
  <meta property="og:locale" content="de_DE">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{base_url}}/assets/img/hero.webp">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <!-- PERFORMANCE: Bootstrap-CSS via CDN (SRI). Produktiv: selbst hosten (DSGVO, kein Drittland-Request). -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/alma.css">
  {{extra_head}}
  <script type="application/ld+json" id="ld-org">{{ld_org}}</script>
  {{ld_page}}
</head>
<body class="{{body_class}}" data-page="{{page}}" data-free-ship="{{free_ship}}" data-ship-cost="{{ship_cost}}" data-cool-cost="{{cool_cost}}">
